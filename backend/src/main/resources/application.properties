spring.application.name=washcare-crm-api
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:washcare;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

washcare.cors.allowed-origin=${WASHCARE_CORS_ALLOWED_ORIGIN:http://localhost:5173}
washcare.jwt.secret=${WASHCARE_JWT_SECRET:}
washcare.owner.email=${WASHCARE_OWNER_EMAIL:}
washcare.owner.password=${WASHCARE_OWNER_PASSWORD:}
washcare.owner.name=${WASHCARE_OWNER_NAME:Shop Owner}
