services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: washcare_crm
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    volumes:
      - washcare-mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DATABASE_URL: jdbc:mysql://database:3306/washcare_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      WASHCARE_OWNER_EMAIL: ${WASHCARE_OWNER_EMAIL:?Set WASHCARE_OWNER_EMAIL in the root .env file}
      WASHCARE_OWNER_PASSWORD: ${WASHCARE_OWNER_PASSWORD:?Set WASHCARE_OWNER_PASSWORD in the root .env file}
      WASHCARE_OWNER_NAME: ${WASHCARE_OWNER_NAME:-Shop Owner}
      WASHCARE_JWT_SECRET: ${WASHCARE_JWT_SECRET:?Set WASHCARE_JWT_SECRET in the root .env file}
      WASHCARE_CORS_ALLOWED_ORIGIN: http://localhost
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  washcare-mysql:
